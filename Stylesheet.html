<style>
/* ─── 색·표면 토큰 (라이트/다크) ─────────────────────────────── */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6;   /* 파랑: 기본 계열 */
  --series-2: #008300;   /* 초록: 두 번째 계열 */
  --good: #0ca30c;
  --warning-text: #8a5a00;
  --warning-bg: #fdf3dd;
  --primary: #2a78d6;
  --primary-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #008300;
    --good: #0ca30c;
    --warning-text: #fab219;
    --warning-bg: #2c2412;
    --primary: #3987e5;
    --primary-ink: #ffffff;
  }
}

/* ─── 기본 레이아웃 ──────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo",
    "Noto Sans KR", sans-serif;
  background: var(--page);
  color: var(--text-primary);
  font-size: 17px;
  line-height: 1.5;
  padding-bottom: 84px; /* 하단 내비 공간 */
}
.app-header {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px 10px;
}
.app-title { font-size: 21px; font-weight: 700; }
.app-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
#main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }
.view > * + * { margin-top: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
}
.card-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.card-hint { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
.center { text-align: center; padding: 24px 0; }

/* ─── 홈: 달성률 ─────────────────────────────────────────────── */
.progress-row { display: flex; justify-content: space-between; align-items: baseline; }
.progress-label { font-size: 15px; color: var(--text-secondary); }
.progress-value { font-size: 34px; font-weight: 800; }
.progress-bar {
  height: 14px; border-radius: 7px; background: var(--grid);
  overflow: hidden; margin-top: 8px;
}
.progress-fill {
  height: 100%; width: 0%; border-radius: 7px;
  background: var(--series-1);
  transition: width .4s ease;
}
.progress-meta { margin-top: 10px; font-size: 14px; color: var(--text-secondary); }
.progress-meta b { color: var(--text-primary); }

/* ─── 홈: 체크리스트 ────────────────────────────────────────── */
.check-list { display: flex; flex-direction: column; gap: 8px; }
.check-item {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-primary);
  font: inherit; font-size: 17px;
  cursor: pointer;
  min-height: 56px;
}
.check-item:active { background: var(--grid); }
.check-box {
  flex: none; width: 26px; height: 26px;
  border: 2px solid var(--text-muted); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: transparent;
}
.check-item.done .check-box {
  background: var(--good); border-color: var(--good); color: #fff;
}
.check-item.done .check-name { text-decoration: line-through; color: var(--text-muted); }
.check-name { font-weight: 600; }
.check-detail { font-size: 13px; color: var(--text-muted); }
.check-note { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

/* ─── 홈: 식사 상태 ─────────────────────────────────────────── */
.meal-status { display: flex; gap: 8px; }
.meal-chip {
  flex: 1; text-align: center; padding: 12px 4px;
  border: 1px solid var(--border); border-radius: 12px;
  font-size: 15px; color: var(--text-secondary);
  background: var(--surface); font: inherit; cursor: pointer;
}
.meal-chip.done { border-color: var(--good); color: var(--text-primary); font-weight: 700; }
.meal-chip .mark { display: block; font-size: 20px; }

/* ─── 버튼 ──────────────────────────────────────────────────── */
.btn {
  font: inherit; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--text-primary);
  cursor: pointer;
}
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
.btn-big { padding: 15px 16px; font-size: 18px; min-height: 56px; }
.btn-full { width: 100%; margin-top: 6px; }
.quick-buttons { display: flex; gap: 10px; }
.quick-buttons .btn { flex: 1; }

/* ─── 폼 ────────────────────────────────────────────────────── */
.field { display: block; margin-bottom: 14px; }
.field-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.field-hint { display: block; font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.input {
  width: 100%; font: inherit; font-size: 17px;
  padding: 13px 12px; min-height: 52px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--page); color: var(--text-primary);
}
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
select.input { appearance: none; }

.seg { display: flex; gap: 6px; }
.seg.wrap { flex-wrap: wrap; }
.seg button {
  flex: 1; min-height: 48px; padding: 10px 8px;
  font: inherit; font-size: 15px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--page); color: var(--text-secondary);
  cursor: pointer; white-space: nowrap;
}
.seg.wrap button { flex: 1 1 30%; }
.seg button.on {
  background: var(--primary); border-color: var(--primary);
  color: var(--primary-ink); font-weight: 700;
}

.toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle {
  min-height: 52px; padding: 12px;
  font: inherit; font-size: 16px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--page); color: var(--text-secondary);
  cursor: pointer;
}
.toggle.on {
  background: var(--primary); border-color: var(--primary);
  color: var(--primary-ink); font-weight: 700;
}

/* ─── 기록 목록 ─────────────────────────────────────────────── */
.record-list { display: flex; flex-direction: column; gap: 8px; }
.record-item {
  border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 13px; font-size: 15px;
}
.record-item .r-title { font-weight: 700; }
.record-item .r-sub { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
.record-item .r-tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.r-tag {
  font-size: 12px; padding: 2px 8px; border-radius: 99px;
  background: var(--grid); color: var(--text-secondary);
}
.empty-hint { color: var(--text-muted); font-size: 15px; padding: 8px 2px; }

/* ─── 안내/경고 ─────────────────────────────────────────────── */
.notice {
  background: var(--warning-bg); color: var(--warning-text);
  border-radius: 12px; padding: 12px 14px;
  font-size: 14px; margin-bottom: 14px;
}
.disclaimer {
  font-size: 13px; color: var(--text-muted);
  padding: 4px 6px 12px; line-height: 1.6;
}

/* ─── 리포트 ────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px;
}
.stat-label { font-size: 13px; color: var(--text-secondary); }
.stat-value { font-size: 27px; font-weight: 800; margin-top: 2px; }
.stat-value small { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
.stat-delta-down { color: var(--good); font-weight: 700; }

.chart-box { position: relative; height: 220px; }
.chart-box.donut { height: 200px; }
.donut-wrap { position: relative; }
.donut-center {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800;
  pointer-events: none;
}

/* ─── 토스트 ────────────────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: var(--text-primary); color: var(--page);
  padding: 12px 20px; border-radius: 99px;
  font-size: 15px; font-weight: 600;
  z-index: 50; max-width: 90vw; text-align: center;
}

/* ─── 하단 내비게이션 ───────────────────────────────────────── */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; min-height: 62px;
  font: inherit; font-size: 13px; font-weight: 600;
  border: 0; background: none; color: var(--text-muted);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.nav-btn .nav-icon { font-size: 21px; }
.nav-btn.on { color: var(--primary); }

/* 저장 중 표시 */
body.busy { cursor: progress; }
body.busy .btn, body.busy .check-item { opacity: .6; pointer-events: none; }
</style>
